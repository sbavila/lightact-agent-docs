<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
  <title id="t">How it works</title>
  <desc id="d">The fetch script copies the live LightAct manual to your machine. Digests in this repository summarise it. An agent reads the index, then a digest, then the exact manual page when it needs to check a detail.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="430" rx="20"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb224"/>
    </marker>
  </defs>
  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="430" fill="#0d1117"/>

    <!-- row labels -->
    <text x="48" y="52" fill="#8a94a6" font-size="16" font-weight="600" letter-spacing="2">GETTING THE MANUAL</text>
    <text x="48" y="262" fill="#8a94a6" font-size="16" font-weight="600" letter-spacing="2">HOW AN AGENT USES IT</text>

    <!-- row 1 -->
    <g>
      <rect x="48" y="74" width="300" height="118" rx="14" fill="#161b26" stroke="#2a3242"/>
      <text x="72" y="112" fill="#f2f4f7" font-size="22" font-weight="700">docs.lightact.com</text>
      <text x="72" y="142" fill="#aab4c3" font-size="17">The live manual. 555 pages,</text>
      <text x="72" y="166" fill="#aab4c3" font-size="17">owned by LightAct.</text>

      <line x1="356" y1="133" x2="440" y2="133" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="450" y="74" width="300" height="118" rx="14" fill="#161b26" stroke="#2a3242"/>
      <text x="474" y="112" fill="#f2f4f7" font-size="22" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scripts/fetch.sh</text>
      <text x="474" y="142" fill="#aab4c3" font-size="17">Run it yourself. About a minute.</text>
      <text x="474" y="166" fill="#aab4c3" font-size="17">Rerun it to refresh.</text>

      <line x1="758" y1="133" x2="842" y2="133" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="852" y="74" width="300" height="118" rx="14" fill="#161b26" stroke="#2a3242" stroke-dasharray="7 6"/>
      <text x="876" y="112" fill="#f2f4f7" font-size="22" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/</text>
      <text x="876" y="142" fill="#aab4c3" font-size="17">Your local copy as markdown.</text>
      <text x="876" y="166" fill="#aab4c3" font-size="17">Never published here.</text>
    </g>

    <!-- row 2 -->
    <g>
      <rect x="48" y="284" width="250" height="104" rx="14" fill="#231a06" stroke="#ffb224"/>
      <text x="72" y="322" fill="#ffb224" font-size="15" font-weight="700" letter-spacing="1.5">STEP 1</text>
      <text x="72" y="350" fill="#f2f4f7" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">digests/INDEX.md</text>
      <text x="72" y="374" fill="#aab4c3" font-size="16">Which digest covers what</text>

      <line x1="306" y1="336" x2="340" y2="336" stroke="#ffb224" stroke-width="2" marker-end="url(#arrowA)"/>

      <rect x="350" y="284" width="250" height="104" rx="14" fill="#231a06" stroke="#ffb224"/>
      <text x="374" y="322" fill="#ffb224" font-size="15" font-weight="700" letter-spacing="1.5">STEP 2</text>
      <text x="374" y="350" fill="#f2f4f7" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">digests/&lt;topic&gt;.md</text>
      <text x="374" y="374" fill="#aab4c3" font-size="16">Names, values, limits</text>

      <line x1="608" y1="336" x2="642" y2="336" stroke="#ffb224" stroke-width="2" marker-end="url(#arrowA)"/>

      <rect x="652" y="284" width="250" height="104" rx="14" fill="#161b26" stroke="#2a3242" stroke-dasharray="7 6"/>
      <text x="676" y="322" fill="#8a94a6" font-size="15" font-weight="700" letter-spacing="1.5">STEP 3 · TO CHECK</text>
      <text x="676" y="350" fill="#f2f4f7" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docs/&lt;page&gt;.md</text>
      <text x="676" y="374" fill="#aab4c3" font-size="16">The exact wording</text>

      <line x1="910" y1="336" x2="944" y2="336" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="954" y="284" width="198" height="104" rx="14" fill="#161b26" stroke="#2a3242"/>
      <text x="978" y="330" fill="#f2f4f7" font-size="20" font-weight="700">A grounded</text>
      <text x="978" y="358" fill="#f2f4f7" font-size="20" font-weight="700">answer</text>
    </g>

    <!-- link between rows -->
    <path d="M1002,192 L1002,232 L777,232 L777,276" fill="none" stroke="#8a94a6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  </g>
</svg>
